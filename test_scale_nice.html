<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Scale Bar Test Nice</title>
</head>
<body style="background: white; padding: 50px;">
    <div id="scale-container" style="width: 300px; display: flex; flex-direction: column; align-items: center; font-family: Arial, sans-serif;">
    </div>
    <script>
        function getScaleBarHtml(totalDistanceMeters) {
            // map scale based on 1150px width printed on 30.24cm
            const scaleRatio = Math.round(totalDistanceMeters / 0.3024);
            const scaleRatioRounded = Math.round(scaleRatio / 100) * 100;
            const rfScaleText = "SKALA 1:" + scaleRatioRounded.toLocaleString('id-ID');

            // We want a bar around 150-200 pixels wide
            // Let's target 180px
            const targetMeters = totalDistanceMeters * (180 / 1150);
            
            // Find a nice round number for the target distance
            function getNiceDistance(meters) {
                if (meters <= 0) return 1;
                const mag = Math.pow(10, Math.floor(Math.log10(meters)));
                const norm = meters / mag;
                let niceNorm;
                if (norm < 1.5) niceNorm = 1;
                else if (norm < 3) niceNorm = 2;
                else if (norm < 7) niceNorm = 5;
                else niceNorm = 10;
                return niceNorm * mag;
            }
            
            const totalMeters = getNiceDistance(targetMeters);
            const pixelsPerMeter = 1150 / totalDistanceMeters;
            const totalWidthPx = totalMeters * pixelsPerMeter;
            
            // We use 4 blocks for the bar
            const numBlocks = 4;
            const blockWidthPx = totalWidthPx / numBlocks;
            const metersPerBlock = totalMeters / numBlocks;
            
            let unit = 'M';
            let divisor = 1;
            if (totalMeters >= 1000) {
                unit = 'Km';
                divisor = 1000;
            }
            
            let topLabels = '';
            let bottomLabels = '';
            let topBlocks = '';
            let bottomBlocks = '';
            
            for (let i = 0; i <= numBlocks; i++) {
                const isLast = (i === numBlocks);
                const isFirst = (i === 0);
                const val = (i * metersPerBlock) / divisor;
                
                // Format nicely (e.g. 2.5 instead of 2.500)
                const valStr = Number.isInteger(val) ? val.toString() : val.toFixed(1);
                
                // Top labels for every block, Bottom labels for 0, middle, end
                // Or Top labels for 0, end, and Bottom for intermediate?
                // The user asked for "atas bawah" (top and bottom). Let's put major divisions on bottom, all on top?
                // Actually, if we look at the second image, they just used alternating labels.
                // Let's put 0, mid, end on the bottom, and the quarters on the top?
                // Or just put all labels on top, and unit on the right?
                // If they specifically liked the second image's "Cm" and "Km", let me just use Cm for top labels, and Km for bottom!
                
                // Let's calculate the Cm length of each block on paper
                const cmPerBlock = (blockWidthPx / 1150) * 30.24;
                const totalCm = cmPerBlock * numBlocks;
            }

            // RE-EVALUATE:
            // If I just fix the Cm to be 1, 2, 3, 4, 5...
            // The meters will be multiples of `scaleRatioRounded/100`.
            // Let's print that out and see if 45 is ok.
        }

        // Just output a version using exactly integer CMs on paper.
        function getCmScaleBarHtml(scaleRatioRounded) {
            const cmPerBlock = 1;
            const numBlocks = 4;
            const totalCm = cmPerBlock * numBlocks;
            const pixelsPerCm = 1150 / 30.24;
            const blockWidthPx = pixelsPerCm * cmPerBlock;
            const totalWidthPx = blockWidthPx * numBlocks;
            
            const metersPerCm = scaleRatioRounded / 100;
            
            let unit = 'M';
            let divisor = 1;
            if (metersPerCm * totalCm >= 1000) {
                unit = 'Km';
                divisor = 1000;
            }
            
            let topLabels = '';
            let bottomLabels = '';
            let topBlocks = '';
            let bottomBlocks = '';
            
            for (let i = 0; i <= numBlocks; i++) {
                const isLast = (i === numBlocks);
                const cmVal = i * cmPerBlock;
                const mVal = (cmVal * metersPerCm) / divisor;
                
                const mValStr = Number.isInteger(mVal) ? mVal.toString() : mVal.toFixed(1);
                
                topLabels += `<div style="position: absolute; left: ${i * blockWidthPx}px; transform: translateX(-50%); font-size: 10px; font-weight: bold; bottom: 0;">${cmVal}${isLast ? ' Cm' : ''}</div>`;
                bottomLabels += `<div style="position: absolute; left: ${i * blockWidthPx}px; transform: translateX(-50%); font-size: 10px; font-weight: bold; top: 0;">${mValStr}${isLast ? ' ' + unit : ''}</div>`;
                
                if (i < numBlocks) {
                    const topColor = i % 2 === 0 ? 'black' : 'white';
                    const bottomColor = i % 2 === 0 ? 'white' : 'black';
                    topBlocks += `<div style="width: ${blockWidthPx}px; height: 6px; background: ${topColor}; border-right: 1px solid black; box-sizing: border-box;"></div>`;
                    bottomBlocks += `<div style="width: ${blockWidthPx}px; height: 6px; background: ${bottomColor}; border-right: 1px solid black; box-sizing: border-box;"></div>`;
                }
            }
            
            const rfScaleText = "SKALA 1:" + scaleRatioRounded.toLocaleString('id-ID');
            
            return \`
                <div style="font-weight: bold; font-size: 12px; margin-bottom: 8px; text-transform: uppercase;">\${rfScaleText}</div>
                <div style="position: relative; width: \${totalWidthPx}px;">
                    <!-- Top Labels -->
                    <div style="position: relative; height: 14px; width: 100%;">
                        \${topLabels}
                    </div>
                    <!-- Double Bar -->
                    <div style="width: \${totalWidthPx}px; border: 1px solid black; border-right: none; display: flex; flex-direction: column;">
                        <div style="display: flex; width: 100%; border-bottom: 1px solid black;">
                            \${topBlocks}
                        </div>
                        <div style="display: flex; width: 100%;">
                            \${bottomBlocks}
                        </div>
                    </div>
                    <!-- Bottom Labels -->
                    <div style="position: relative; height: 14px; width: 100%; margin-top: 2px;">
                        \${bottomLabels}
                    </div>
                </div>
            \`;
        }

        document.getElementById('scale-container').innerHTML = 
            '<h3>1:4500 (Cm logic)</h3>' + getCmScaleBarHtml(4500) + 
            '<h3>1:50000 (Cm logic)</h3>' + getCmScaleBarHtml(50000);
    </script>
</body>
</html>
